experiment: rmaml_conv4_csgdm

model:
  backbone: conv4
  n_way: 5

meta:
  n_inner: 5        # inner loop steps
  alpha: 0.1        # inner loop LR
  meta_batch: 4     # tasks per outer update
  n_epochs: 60000

optimizer:
  type: csgdm       # cadam | csgdm
  outer_lr: 0.0001
  weight_decay: 0.0

data:
  dataset: miniimagenet
  root: ./data/miniimagenet
  k_shot: 1
  q_query: 15
  augment: true

logging:
  log_every: 100
  eval_every: 500
  checkpoint_every: 1000
  orth_check_every: 500
