experiment: rmaml_hpo_best

model:
  backbone: conv4
  n_way: 5

meta:
  n_inner: 5
  alpha: 0.018
  meta_batch: 4
  n_epochs: 60000

optimizer:
  type: cadam
  outer_lr: 0.000217
  weight_decay: 0.0

data:
  dataset: miniimagenet
  root: ./data/miniimagenet
  k_shot: 1
  q_query: 15
  augment: true

logging:
  log_every: 100
  eval_every: 500
  checkpoint_every: 1000
  orth_check_every: 500
